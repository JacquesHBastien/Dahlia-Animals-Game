<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <title>Cloud Step</title>
  <!-- outline first, then the same shapes filled on top, so only the outside edge shows -->
  <g fill="none" stroke="#3A2626" stroke-width="6" stroke-linejoin="round">
    <circle cx="50" cy="44" r="26"/><circle cx="92" cy="32" r="30"/><circle cx="136" cy="38" r="28"/><circle cx="168" cy="50" r="20"/>
    <rect x="20" y="40" width="166" height="32" rx="16"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="50" cy="44" r="26"/><circle cx="92" cy="32" r="30"/><circle cx="136" cy="38" r="28"/><circle cx="168" cy="50" r="20"/>
    <rect x="20" y="40" width="166" height="32" rx="16"/>
  </g>
  <g fill="#C9A7F5" opacity=".45"><ellipse cx="70" cy="62" rx="22" ry="5"/><ellipse cx="140" cy="62" rx="18" ry="4"/></g>
</svg>
