<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120">
  <title>Frog</title>
  <g stroke="#3A2626" stroke-width="3" stroke-linejoin="round">
    <!-- back legs -->
    <ellipse cx="28" cy="98" rx="22" ry="12" fill="#6DB377"/>
    <ellipse cx="112" cy="98" rx="22" ry="12" fill="#6DB377"/>
    <!-- body -->
    <ellipse cx="70" cy="76" rx="48" ry="36" fill="#7DB97A"/>
    <!-- eye bumps -->
    <circle cx="44" cy="40" r="18" fill="#7DB97A"/>
    <circle cx="96" cy="40" r="18" fill="#7DB97A"/>
    <!-- front feet -->
    <ellipse cx="48" cy="110" rx="12" ry="6" fill="#6DB377"/>
    <ellipse cx="92" cy="110" rx="12" ry="6" fill="#6DB377"/>
  </g>
  <!-- belly -->
  <ellipse cx="70" cy="88" rx="30" ry="18" fill="#CDEBB0"/>
  <!-- eyes -->
  <circle cx="44" cy="40" r="10" fill="#FFFFFF"/><circle cx="96" cy="40" r="10" fill="#FFFFFF"/>
  <circle cx="46" cy="42" r="6" fill="#1E1412"/><circle cx="94" cy="42" r="6" fill="#1E1412"/>
  <circle cx="48" cy="40" r="2" fill="#fff"/><circle cx="96" cy="40" r="2" fill="#fff"/>
  <!-- smile and cheeks -->
  <path d="M50 70 Q70 86 90 70" fill="none" stroke="#3A2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="70" r="7" fill="#F48FC2" opacity=".55"/><circle cx="100" cy="70" r="7" fill="#F48FC2" opacity=".55"/>
</svg>
