<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit + no zoom so the iPad shows the game full screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Magic Animals &amp; Friends</title>

  <!-- The app's name and picture when it's added to an iPad's Home Screen (or installed on a computer) -->
  <meta name="apple-mobile-web-app-title" content="Magic Animals">
  <meta name="application-name" content="Magic Animals">
  <meta name="theme-color" content="#E6378F">
  <link rel="apple-touch-icon" href="assets/app-icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/app-icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/app-icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The stage is the 16:9 game area. Everything sits inside it. -->
  <div id="stage">
    <!-- The whole game world is drawn on this one canvas -->
    <canvas id="game"></canvas>

    <!-- Title screen (hidden when you press Play) -->
    <div id="title">
      <div class="card">
        <h1>Magic Animals &amp; Friends</h1>
        <img class="waving" src="assets/dahlia.svg" alt="Dahlia waving hello">
        <button id="play">Play</button>
        <p class="howto" id="howto"></p>
        <p class="credit">Game designed by Dahlia</p>
      </div>
    </div>

    <!-- Touch buttons (only shown on iPads and phones), like a game controller:
         left thumb moves, right thumb jumps, does magic, and does special moves (Down) -->
    <div id="touch" hidden>
      <button class="move left"  data-key="ArrowLeft"  aria-label="Left"><img src="assets/icon-arrow.svg" alt=""></button>
      <button class="move right" data-key="ArrowRight" aria-label="Right"><img src="assets/icon-arrow.svg" alt=""></button>
      <button class="action jump"  data-key="ArrowUp"   aria-label="Jump"><img src="assets/icon-arrow.svg" alt=""><span>Jump</span></button>
      <button class="action magic" data-key=" "         aria-label="Magic"><img src="assets/icon-sparkle.svg" alt=""><span>Magic</span></button>
      <button class="action down"  data-key="ArrowDown" aria-label="Down"><img src="assets/icon-arrow.svg" alt=""><span>Down</span></button>
    </div>
  </div>

  <!-- Order matters: sounds and data first, then the game that uses them -->
  <script src="sounds.js"></script>
  <script src="music.js"></script>
  <script src="data/scenes.js"></script>
  <script src="data/animals.js"></script>
  <script src="data/levels.js"></script>
  <script src="challenges.js"></script>
  <script src="game.js"></script>
</body>
</html>
